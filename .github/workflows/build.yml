name: Build X64 Syscall Service (Auto-Signed)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Repositoriyi Cek
      uses: actions/checkout@v4

    - name: MSVC ve MASM Ortamini Hazirla
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: MASM Assembly Derle
      run: |
        ml64.exe /c /Cx /Fo syscall_stub.obj syscall_stub.asm

    - name: C++ Derle ve Linkle
      run: |
        cl.exe /O2 /EHsc main.cpp syscall_stub.obj /Fe:Win_Update_Service_X64.exe /link user32.lib gdi32.lib advapi32.lib

    - name: Gecerli Self-Signed Sertifika Uret ve EXE'yi Imzala
      shell: powershell
      run: |
        # 1. Kendi adimiza test sertifikasi olusturuyoruz
        $cert = New-SelfSignedCertificate -CertStoreLocation Cert:\CurrentUser\My -Subject "CN=DeveloperBuild, O=DevStudio, C=US" -Type CodeSigningCert -KeyUsage DigitalSignature

        # 2. Windows SDK içindeki SignTool yolunu buluyoruz
        $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Select-Object -First 1).FullName

        # 3. EXE dosyasini zaman damgali (Timestamp) olarak imzalayalim
        & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint /t http://timestamp.digicert.com Win_Update_Service_X64.exe

    - name: Imzali EXE Dosyasini Artifact Olarak Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Signed_Win_Update_Service_X64
        path: Win_Update_Service_X64.exe
        
