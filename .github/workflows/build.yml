name: Build X64 Project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Repositoriyi Cek
      uses: actions/checkout@v4

    - name: MSVC ve MASM Ortamini Hazirla
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: MASM Assembly (syscall_stub.asm) Derle
      run: |
        ml64.exe /c /Cx /Fo syscall_stub.obj syscall_stub.asm

    - name: C++ (main.cpp) Derle ve Linkle
      run: |
        cl.exe /O2 /EHsc main.cpp syscall_stub.obj /Fe:Win_Update_Service_X64.exe /link user32.lib gdi32.lib advapi32.lib

    - name: EXE Boyutunu 4 MB'a Sabitle (Padding)
      shell: powershell
      run: |
        $exePath = ".\Win_Update_Service_X64.exe"
        $targetSize = 4 * 1024 * 1024
        $fileInfo = Get-Item $exePath
        
        if ($fileInfo.Length -lt $targetSize) {
            $bytesToAdd = $targetSize - $fileInfo.Length
            $randBytes = New-Object Byte[] $bytesToAdd
            (New-Object Random).NextBytes($randBytes)
            
            # FileStream kullanarak güvenli bir şekilde dosyanın sonuna ekleme yapıyoruz
            $stream = [System.IO.File]::Open($exePath, [System.IO.FileMode]::Append, [System.IO.FileAccess]::Write)
            $stream.Write($randBytes, 0, $randBytes.Length)
            $stream.Close()
            $stream.Dispose()
            
            Write-Host "Dosya boyutu 4 MB olarak guncellendi. Eklenen bayt: $bytesToAdd"
        }

    - name: Sertifika Olustur ve EXE Imzala
      shell: powershell
      run: |
        # Kendi adimiza test sertifikasi olusturuyoruz
        $cert = New-SelfSignedCertificate -CertStoreLocation Cert:\CurrentUser\My -Subject "CN=DeveloperBuild, O=DevStudio, C=US" -Type CodeSigningCert -KeyUsage DigitalSignature

        # EXE dosyasini PowerShell Set-AuthenticodeSignature ile doğrudan imzalayalim
        Set-AuthenticodeSignature -FilePath .\Win_Update_Service_X64.exe -Certificate $cert -HashAlgorithm SHA256

    - name: Imzali EXE Dosyasini Artifact Olarak Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Signed_Win_Update_Service_X64
        path: Win_Update_Service_X64.exe
        
